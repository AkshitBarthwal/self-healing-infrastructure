global:
  resolve_timeout: 5m

route:
  receiver: webhook-receiver
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: webhook-receiver
    webhook_configs:
      - url: "http://webhook:5001/alerts"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/webhook_token
